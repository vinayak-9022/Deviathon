<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLITZa - Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .neon-gradient-text {
        background-image: linear-gradient(to right, #e74c3c, #8e44ad, #3498db);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    @keyframes background-shift {
        0% { background-position: 0% 50%; }
        100% { background-position: 100% 50%; }
    }
    .animated-bg {
        background-color: #1A0F3D;
        background-image: linear-gradient(90deg, #4e4667, #31156D, #1A0F3D);
        background-size: 200% 200%;
        animation: background-shift 20s ease infinite alternate;
    }
    .register-button {
        background-color: #00FF80;
        color: #1A0F3D;
        transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .register-button:hover {
        background-color: #00E070;
        transform: translateY(-2px);
        box-shadow: 0 5px 25px rgba(0, 255, 128, 0.5);
    }
    .themed-input {
        background-color: #31156D;
        border: 1px solid #4e4667;
        color: #ffffff;
        transition: border-color 0.3s, box-shadow 0.3s;
    }
    .themed-input:focus {
        outline: none;
        border-color: #8e44ad;
        box-shadow: 0 0 10px rgba(142, 68, 173, 0.5);
    }
    .register-card {
        background: rgba(30, 20, 60, 0.8);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        animation: float-in 1s ease-out forwards;
    }
    @keyframes float-in {
        from { opacity: 0; transform: scale(0.8) translateY(50px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
</style>
</head>
<body class="animated-bg min-h-screen font-sans text-white flex items-center justify-center p-4">

<div class="register-card w-full max-w-lg p-8 sm:p-10 rounded-xl space-y-8">

    <div class="flex flex-col items-center space-y-4">
        <img src="logo.jpg" alt="BLITZa Logo" class="h-16 w-16 object-contain rounded-full"
             onerror="this.onerror=null;this.src='https://placehold.co/64x64/B640FF/ffffff?text=B';">
        <h1 class="text-4xl font-extrabold neon-gradient-text">Create Your BLITZa Account</h1>
        <p class="text-gray-400">Start automating your business insights today.</p>
    </div>

    <form id="register-form" class="space-y-6">

        <div>
            <label for="full-name" class="text-sm font-medium text-gray-300 block mb-2 text-left">Full Name</label>
            <input type="text" id="full-name" placeholder="John Cena" required class="themed-input w-full p-3 rounded-lg placeholder-gray-500">
        </div>

        <div>
            <label for="email" class="text-sm font-medium text-gray-300 block mb-2 text-left">Email Address</label>
            <input type="email" id="email" placeholder="you@company.com" required class="themed-input w-full p-3 rounded-lg placeholder-gray-500">
        </div>

        <div>
            <label for="password" class="text-sm font-medium text-gray-300 block mb-2 text-left">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required class="themed-input w-full p-3 rounded-lg placeholder-gray-500">
        </div>

        <div>
            <label for="confirm-password" class="text-sm font-medium text-gray-300 block mb-2 text-left">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Re-enter password" required class="themed-input w-full p-3 rounded-lg placeholder-gray-500">
        </div>

        <button type="submit" class="register-button w-full px-5 py-3 rounded-lg font-bold text-lg tracking-wider shadow-lg">Register</button>
    </form>

    <p class="text-center text-sm text-gray-400">
        Already have an account?
        <a href="login.html" class="font-medium text-pink-400 hover:text-pink-300 transition duration-150">Sign In</a>
    </p>
</div>

<!-- Firebase + Register JS -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAePGpDRmz3R4UaxEeqiVTaaMsYx2s44qM",
        authDomain: "blitza-9fa4a.firebaseapp.com",
        projectId: "blitza-9fa4a",
        storageBucket: "blitza-9fa4a.firebasestorage.app",
        messagingSenderId: "818364742419",
        appId: "1:818364742419:web:bc34d1cb20d2b6216d38e6",
        measurementId: "G-QZ58N8V3XT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const registerForm = document.getElementById("register-form");
    registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullName = document.getElementById("full-name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        if (password.length < 8) {
            alert("Password must be at least 8 characters.");
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            alert("Registration successful!");
            console.log("User created:", userCredential.user.uid);
            window.location.href = "login.html"; // redirect to login
        } catch (err) {
            alert("Error: " + err.message);
            console.error(err);
        }
    });
</script>

</body>
</html>
