<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLITZa Research Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    
    <div class="greeting">
      <h1>Hello, <span id="username">Welcome To BLITZa</span></h1>
      <p>What should we do today?</p>
    </div>

     <div class="chat-wrapper"> 
      <div class="chat-container" id="chat-container"> 
      <div class="message ai-message"> Hi I am Blitza, your specialized AI business analyst. How can I assist with your research or queries today? </div>
       <div class="message ai-message tip-message"> *Tip:* Ask me about market trends, competitor analysis, or business strategies. 

    </div>  </div> </div>

    
    <div class="search-box">
      <input type="text" id="query" placeholder="Ask anything..." />
      <button id="search-btn"></button>
    </div>
  </div> 

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
